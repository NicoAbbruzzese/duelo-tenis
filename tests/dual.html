<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Duelo Tenis — banco de pruebas (anfitrión + invitado)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 12px/1.4 monospace; }
  #wrap { display: flex; height: calc(100% - 92px); }
  iframe { flex: 1; border: 0; min-width: 0; }
  #info { height: 92px; overflow: auto; padding: 4px 8px; white-space: pre-wrap; background: #000; }
</style>
</head>
<body>
<div id="wrap"><iframe id="h"></iframe><iframe id="g"></iframe></div>
<div id="info">cargando…</div>
<script>
// Uso: tests/dual.html?net=p2p|relay|auto&lag=60&jit=20&loss=0.02&bots=1&start=1&pred=0
const q = new URLSearchParams(location.search);
const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const code = q.get('sala') || Array.from({ length: 4 }, () => L[Math.floor(Math.random() * L.length)]).join('');
const pass = ['net', 'lag', 'jit', 'loss', 'pred'].filter((k) => q.has(k)).map((k) => '&' + k + '=' + encodeURIComponent(q.get(k))).join('');
const bots = q.get('bots') !== '0';
const start = q.get('start') !== '0';
const H = document.getElementById('h'), G = document.getElementById('g');
if (q.get('layout') === 'v') document.getElementById('wrap').style.flexDirection = 'column';
if (q.has('hh')) { H.style.flex = 'none'; H.style.height = q.get('hh') + 'px'; }
if (q.has('noinfo')) { document.getElementById('info').style.display = 'none'; document.getElementById('wrap').style.height = '100%'; }
H.src = '../index.html?debug=1&auto=host&sala=' + code + (start ? '&autostart=1' : '') + (bots && q.get('hbot') !== '0' ? '&bot=3' : '') + '&name=Rojo' + pass + (q.get('hx') ? '&' + q.get('hx') : '');
setTimeout(() => { G.src = '../index.html?debug=1&auto=join&sala=' + code + (bots && q.get('gbot') !== '0' ? '&bot=4' : '') + '&name=Azul' + pass + (q.get('gx') ? '&' + q.get('gx') : ''); }, Number(q.get('delay')) || 1500);

const st = { samples: 0, maxErr: 0, sumErr: 0, ownJump: 0, lastOwn: null, startAt: 0, matches: 0, lastPhase: -1, guestScoreMismatch: 0 };
window.dual = { code, st, host: () => H.contentWindow.__dt, guest: () => G.contentWindow.__dt };
function tick() {
  const h = H.contentWindow && H.contentWindow.__dt, g = G.contentWindow && G.contentWindow.__dt;
  const out = [];
  out.push('sala ' + code + '  params: ' + (pass || '(ninguno)'));
  if (h) {
    const a = h.app, Gm = a.G;
    out.push('ANFITRION pantalla=' + a.screen + ' enJuego=' + a.inGame + ' enlace=' + (a.link ? (a.link.up ? 'ok' : 'no') + ' via=' + a.link.via + ' tipo=' + a.link.kind + ' rtt=' + Math.round(a.link.rtt) : '-') +
      (Gm ? ' | tick=' + Gm.tick + ' fase=' + Gm.phase + ' saca=' + Gm.server + ' pts=' + Gm.sc.pts + ' juegos=' + Gm.sc.games + ' sets=' + Gm.sc.sets + ' peloteo=' + Gm.rally : ''));
  }
  if (g) {
    const a = g.app, L2 = a.buf.latest();
    out.push('INVITADO  pantalla=' + a.screen + ' enJuego=' + a.inGame + ' enlace=' + (a.link ? (a.link.up ? 'ok' : 'no') + ' via=' + a.link.via + ' tipo=' + a.link.kind + ' rtt=' + Math.round(a.link.rtt) : '-') +
      (L2 ? ' | tick=' + L2.tick + ' fase=' + L2.ph + ' pts=' + L2.sc.pts + ' juegos=' + L2.sc.games + ' retraso=' + a.buf.delay.toFixed(2) + 'ticks jitter=' + a.buf.jitter.toFixed(1) + 'ms pend=' + a.pending.length : ''));
    // error de predicción: posición mostrada del invitado vs. posición real en el anfitrión
    if (h && h.app.G && a.inGame && a.own.init) {
      const real = h.app.G.pl[1];
      const err = Math.hypot(real.x - a.own.x, real.z - a.own.z);
      st.samples++; st.sumErr += err; if (err > st.maxErr) st.maxErr = err;
      out.push('prediccion propia: error medio ' + (st.sumErr / st.samples).toFixed(3) + ' m, max ' + st.maxErr.toFixed(2) + ' m (' + st.samples + ' muestras)');
    }
  }
  document.getElementById('info').textContent = out.join('\n');
}
setInterval(tick, 250);
</script>
</body>
</html>
